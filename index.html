<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Folha de Pagamento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container-fluid justify-content-center">
      <span class="navbar-brand mb-0 h1 text-center">Folha de Pagamento</span>
      </div>
    </div>
  </nav>
  <div class="container mt-5 pt-5">
    <h1 class="text-center mb-4">Sistema de Folha de Pagamento</h1>
    <div class="mb-4">
      <label for="salarioMinimo" class="form-label">Valor do salário mínimo (R$):</label>
      <input type="number" id="salarioMinimo" class="form-control" placeholder="Ex: 1412">
    </div>
    <section id="form">
      <h3>Cadastrar Funcionário</h3>
      <form id="funcionarioForm" class="row g-3">
        <div class="col-md-6">
          <label for="codigo" class="form-label">Código do Funcionário</label>
          <input type="text" id="codigo" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label for="horas" class="form-label">Horas Trabalhadas</label>
          <input type="number" id="horas" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label for="categoria" class="form-label">Categoria</label>
          <select id="categoria" class="form-select" required>
            <option value="">Selecione...</option>
            <option value="F">Operacional</option>
            <option value="G">Gerente</option>
          </select>
        </div>
        <div class="col-md-6">
          <label for="turno" class="form-label">Turno</label>
          <select id="turno" class="form-select" required>
            <option value="">Selecione...</option>
            <option value="M">Matutino</option>
            <option value="V">Vespertino</option>
            <option value="N">Noturno</option>
          </select>
        </div>
        <div class="col-md-6">
          <label for="nota" class="form-label">Avaliação de Desempenho (0 a 10)</label>
          <input type="number" id="nota" class="form-control" min="0" max="10" step="0.1" required>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Adicionar Funcionário</button>
        </div>
      </form>
    </section>
    <section id="relatorio" class="mt-5">
      <h3>Relatório Mensal</h3>
      <div id="resultado" class="mt-3"></div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
